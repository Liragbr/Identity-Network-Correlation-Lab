[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "identity-network-correlation-lab"
version = "1.0.0"
description = "Controlled SOC telemetry generation and correlation for authentication and network discovery"
requires-python = ">=3.10"
authors = [{name = "Gabriel Lira"}]
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
soclab = "soclab.__main__:main"
