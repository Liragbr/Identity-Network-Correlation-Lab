title: Lab Distinct Identity Authentication Failures Per Origin
id: 223b9ddb-0340-4a4c-9431-a5daa42463bb
status: experimental
description: >-
  Correlates unique principal values after denied authentications. Indicates
  a password spray PATTERN, not confirmed common-password reuse or compromise.
author: Gabriel Lira
date: 2026-11-20
references:
  - https://sigmahq.io/docs/meta/correlations.html
  - https://attack.mitre.org/techniques/T1110/003/
correlation:
  type: value_count
  rules:
    - c1277650-02d5-48ce-940a-15dd80f3f9e1
  group-by:
    - src_ip
  timespan: 2m
  condition:
    field: principal
    gte: 6
falsepositives:
  - Authorized bulk authentication tests
  - Proxies or shared egress IPs that merge unrelated users
level: medium
tags:
  - attack.credential-access
  - attack.t1110.003
